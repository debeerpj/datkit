[project]
name = "datkit"
version = "0.1.0"
description = "Toolkit to speed up specific exploratory data analysis tasks"
readme = "README.md"
authors = [
    { name = "Paul de Beer" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",      # was >=2.2.6 — excluded the cleanroom's 2.2.0
    "pandas>=2.2.3",     # was >=2.3.3 — excluded the cleanroom's 2.2.3
    "pydantic>=2.9.2",   # was >=2
    "pyyaml>=6.0.2",     # was >=6
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "duckdb==1.1.1",
    "ipykernel>=7.3.0",
    "psutil>=7.2.2",
    "pyarrow>=18.1.0",
    "pytest>=8.3.4",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D"]
ignore = ["D401", "SIM108","W291"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
